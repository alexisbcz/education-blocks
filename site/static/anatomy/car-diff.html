3 334Z"/></g></svg><span class="cd-sr" aria-live="polite" data-say></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Carrier = (ωL + ωR)/2, always</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Half-shafts: each wheel's own speed</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Spider gears spin only when the wheels differ</span></span><span class="iso-caption">In a turn the outer wheel travels farther than the inner one. The ring gear drives the carrier, and the spider gears let the two side gears share its motion unevenly: the carrier always turns at the average, ω_c = (ω_L + ω_R)/2. Car at 10 m/s, track 1.6 m, tyre radius 0.32 m, final drive 3.7:1; the pinion turns 3.7 times faster than the carrier. Driving straight, the spiders do not spin on their pin and the whole carrier turns as one block.</span></figcaption></figure></div>
