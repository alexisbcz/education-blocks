="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Hub and spinner: the rotor, 100 m across at full scale</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Blades cut away near the root: watch the section pitch above rated wind</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Gearbox 1:100: the generator turns 100× faster (drawn slower)</span></span><span class="iso-caption">Rotor power is P = ½ρAv³·Cp with ρ = 1.225 kg/m³ and A = π·(50 m)². Cp(λ, β) is Heier's empirical model: it peaks at 0.480 at a tip speed ratio λ = 8.10, below the Betz limit 16/27 ≈ 0.593. From cut-in (3 m/s) to rated wind (11.5 m/s) the rotor speed follows the wind to hold that λ; above rated it is held at 17.8 rpm and the blades pitch to keep the power at 3.5 MW; above cut-out (25 m/s) they feather and the rotor stops. Generator and converter losses are ignored: the power shown is what the rotor takes from the wind.</span></figcaption></figure></div>
