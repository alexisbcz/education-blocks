path d="M1.5 5h13"/></svg>EV = log₂(N²/t) at ISO 100</span></span><span class="iso-caption">The aperture ring sets the f-number N = f/D. The iris opening's diameter D falls as 1/N, so its area falls as 1/N²: each marked stop (1.4, 2, 2.8, 4 …) multiplies N by √2 and halves the light. The shutter dial sets the time t; each step also halves or doubles it. Settings with the same exposure value EV = log₂(N²/t) let the same light reach the sensor: f/8 at 1/125 s is EV 12.97, and so is f/5.6 at 1/250 s (12.94, the marked numbers are rounded). Space fires the focal-plane shutter: the first curtain drops to expose the sensor and the second follows to close it; speeds faster than 1/8 s are slowed down so you can see them.</span></figcaption></figure></div>
