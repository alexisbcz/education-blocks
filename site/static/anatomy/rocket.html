s="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Load cell under the arm: it measures the thrust</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Dials: chamber pressure 0–10 MPa (left), thrust 0–120 kN (right)</span></span><span class="iso-caption">Throttle sets the chamber pressure (7 MPa at 100%) and so the mass flow ṁ = Pc·At/c*. Thrust is F = Cf·Pc·At with the ideal thrust coefficient for γ = 1.2, exit Mach 3.60 and sea-level ambient pressure, so Isp falls as you throttle down: the nozzle is overexpanded (exit pressure below ambient), and below about 0.4 of ambient (Summerfield's rule of thumb) the flow would separate from the wall. c* = 1780 m/s is a typical kerosene/oxygen value; the plume is drawn, not simulated.</span></figcaption></figure></div>
