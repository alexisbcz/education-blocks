="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Reaction wheel: spins opposite to the body (spokes slowed 100× to be visible)</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Pointer on the table: yaw against the 5° scale of the bearing cup</span></span><span class="iso-caption">A torque-limited PD controller turns the body to the commanded yaw; every newton-metre it applies to the body, the wheel takes the other way, so body and wheel momenta always cancel. Body inertia 0.05 kg·m², wheel 2 × 10⁻⁵ kg·m², up to 6000 rpm: a 60° slew spins the wheel to a few thousand rpm. The wheel sits inside a real CubeSat; it is drawn on the deck here so you can see it.</span></figcaption></figure></div>
